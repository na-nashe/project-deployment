services:
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d backend"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db
    networks:
      - backend-network

  java-service:
    container_name: java_app_container
    build: https://github.com/na-nashe/spring-back-end.git
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/backend
      - SPRING_DATASOURCE_USERNAME=backend
      - SPRING_DATASOURCE_PASSWORD=backend
      - JWT_PRIVATE_KEY_PATH=/app/certs/private.pem
      - JWT_PUBLIC_KEY_PATH=/app/certs/public.pem
      - AI_SERVICE_URL=http://python-service:8000
    volumes:
      - ./certs:/app/certs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network

  python-service:
    container_name: python_app_container
    build: https://github.com/na-nashe/nanashe-ai-worker.git
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - backend-network

  svelte-app:
    container_name: svelte_app_container
    build: git@github.com:na-nashe/svelte-front-end.git
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://java-service:8080
    depends_on:
      - java-service
    networks:
      - backend-network

volumes:
  postgres_data:

networks:
  backend-network:
    driver: bridge
